[project]

name = "oceandiff"
version = "0.1.0"
description = "testing and diagnosing differences in NetCDF outputs"
authors = [
    { name="Olivia Smedley", email="olivia.smedley@metoffice.gov.uk" }
]
requires-python = ">=3.11,<4.0"  # <-- Python version constraint
dependencies = [
    "xarray>=2023.9",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "imageio>=2.31",
    "scipy>=1.11"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0"
]
dev = [
    "black>=23.0",
    "pylint>=3.0",
    "pytest>=8.0",
    "netCDF4>=1.6"
]

[tool.pytest.ini_options]
pythonpath = ["."]  # Allow pytest to find oceandiff from repo root
testpaths = ["tests"]

[project.scripts]
oceandiff = "oceandiff.cli.main:main"
